services:
  db:
    image: postgres:16
    container_name: internal-tools-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: internal-tools
      POSTGRES_PASSWORD: internal-tools
      POSTGRES_DB: internal-tools
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
